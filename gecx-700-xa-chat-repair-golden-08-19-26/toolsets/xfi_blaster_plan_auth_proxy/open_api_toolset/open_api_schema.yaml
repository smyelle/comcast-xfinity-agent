openapi: 3.0.3
info:
  title: Xfinity WiFi Blaster Plan API
  version: 1.0.0
  description: >-
    Uses GECX dynamic variable "coverage_platform_server" as its backing service
    domain, resolving session transactions through the Apigee auth-proxy gateway
    domain specified in variable "apigee_server". Gets a WiFi blaster plan ID for
    a customer's gateway. The x-url header must be dynamically constructed with
    the gateway MAC. For a targeted device blaster plan, append the selected
    connected device MAC as the device_id query parameter. The wrapper resolves
    that value from the customer's selected defaultNickname; the model must not
    ask for or expose MAC addresses.
    URL formats:
    - https://gw.api.dh.comcast.com/speed-test/blaster/api/blast/{cable_modem_mac}
    - https://gw.api.dh.comcast.com/speed-test/blaster/api/blast/{cable_modem_mac}?device_id={device_mac_address}

servers:
- url: '$env_var'

paths:
  /v1/auth-proxy:
    post:
      summary: Get WiFi blaster plan
      operationId: getWifiBlasterPlan
      description: >-
        Gets the WiFi blaster plan ID needed by the follow-up operation that
        starts a WiFi blaster test. The XBO ID should come from session
        context/state xbo_id, and the gateway MAC should come from
        cable_modem_mac. For a one-device issue, the Python wrapper may append
        device_id to the dynamic x-url after resolving the customer's selected
        defaultNickname to the stored connected-device macAddress.
      parameters:
      - name: accept
        in: header
        required: true
        schema:
          type: string
          default: application/json
          example: application/json
      - name: content-type
        in: header
        required: true
        schema:
          type: string
          default: application/json
          example: application/json
      - name: account-id
        in: header
        required: true
        schema:
          type: string
        description: Customer XBO ID value sent in the required account-id header.
      - name: agent_name
        in: header
        required: false
        schema:
          type: string
          default: gecx_repair_agent
        description: Originating agent identifier for request tracking.
      - name: session-id
        in: header
        required: false
        schema:
          type: string
        description: Session identifier for request tracing.
      - name: x-auth
        in: header
        required: true
        schema:
          type: string
          default: ST-SAT-XAXLR
          example: ST-SAT-XAXLR
        description: Authentication identifier for the xFi Speed Platform SAT.
      - name: x-scope
        in: header
        required: true
        schema:
          type: string
          default: "x1:xfi-speed-platform:gateway,x1:xfi-speed-platform:blaster:poll,x1:xfi-speed-platform:blaster,x1:xfi-coverage-platform:read"
          example: "x1:xfi-speed-platform:gateway,x1:xfi-speed-platform:blaster:poll,x1:xfi-speed-platform:blaster,x1:xfi-coverage-platform:read"
        description: Authorization scopes required by the WiFi blaster plan API.
      - name: x-url
        in: header
        required: true
        schema:
          type: string
          format: uri
        description: >-
          Target xFi Speed Platform WiFi blaster URL. Must be dynamically
          constructed with the gateway MAC. For a targeted device test, append
          the selected device MAC as the device_id query parameter.
          Formats:
          - https://gw.api.dh.comcast.com/speed-test/blaster/api/blast/{cable_modem_mac}
          - https://gw.api.dh.comcast.com/speed-test/blaster/api/blast/{cable_modem_mac}?device_id={device_mac_address}
        example: "https://gw.api.dh.comcast.com/speed-test/blaster/api/blast/E8:CD:15:2F:D0:54"
      - name: x-flow-trace-id
        in: header
        required: false
        schema:
          type: string
        x-ces-session-context: $context.session_id
        description: Unique session flow trace identifier.
      responses:
        "200":
          description: Successful WiFi blaster plan response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiBlasterPlanResponse'
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
components:
  schemas:
    WifiBlasterPlanResponse:
      type: object
      additionalProperties: true
      properties:
        planId:
          type: string
