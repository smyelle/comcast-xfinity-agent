openapi: 3.0.3
info:
  title: Xfinity Gateway Device Connections API
  version: 1.0.0
  description: >-
    Uses GECX dynamic variable "coverage_platform_server" as its backing service
    domain, resolving all session transactions through the Apigee auth-proxy
    gateway domain specified in variable "apigee_server". Gets gateway device
    connection and coverage details for a customer's XBO ID and gateway.
    The x-url header must be dynamically constructed with XBO ID and
    gateway MAC.
    URL format: https://gw.api.dh.comcast.com/coverage/api/ip_gateway_device_connections/accounts/{xbo_id}/gateways/{macid}?partnerId=comcast

servers:
- url: '$env_var'

paths:
  /v1/auth-proxy:
    get:
      summary: Get gateway device connections
      operationId: getGatewayDeviceConnections
      description: >-
        Gets device connection and coverage information for the customer's
        Xfinity gateway through the xFi Coverage Platform. The XBO ID should
        come from session context/state xbo_id, and the gateway MAC should come
        from cable_modem_mac.
      parameters:
      - name: accept
        in: header
        required: true
        schema:
          type: string
          default: application/json
          example: application/json
      - name: content-type
        in: header
        required: true
        schema:
          type: string
          default: application/json
          example: application/json
      - name: account-id
        in: header
        required: true
        schema:
          type: string
        description: Customer XBO ID value sent in the required account-id header.
      - name: agent_name
        in: header
        required: false
        schema:
          type: string
          default: gecx_repair_agent
        description: Originating agent identifier for request tracking.
      - name: session-id
        in: header
        required: false
        schema:
          type: string
        description: Session identifier for request tracing.
      - name: x-auth
        in: header
        required: true
        schema:
          type: string
          default: ST-SAT-XAXLR
          example: ST-SAT-XAXLR
        description: Authentication identifier for the xFi Coverage Platform SAT.
      - name: x-scope
        in: header
        required: true
        schema:
          type: string
          default: "x1:xfi-speed-platform:gateway,x1:xfi-speed-platform:blaster:poll,x1:xfi-speed-platform:blaster,x1:xfi-coverage-platform:read"
          example: "x1:xfi-speed-platform:gateway,x1:xfi-speed-platform:blaster:poll,x1:xfi-speed-platform:blaster,x1:xfi-coverage-platform:read"
        description: Authorization scopes required by the coverage/device-connections API.
      - name: x-url
        in: header
        required: true
        schema:
          type: string
          format: uri
        description: >-
          Target xFi Coverage Platform URL. Must be dynamically constructed
          with the customer XBO ID and gateway MAC.
          Format: https://gw.api.dh.comcast.com/coverage/api/ip_gateway_device_connections/accounts/{xbo_id}/gateways/{macid}?partnerId=comcast
        example: "https://gw.api.dh.comcast.com/coverage/api/ip_gateway_device_connections/accounts/{xbo_id}/gateways/8C:76:3F:CE:1A:CB?partnerId=comcast"
      - name: x-flow-trace-id
        in: header
        required: false
        schema:
          type: string
        x-ces-session-context: $context.session_id
        description: Unique session flow trace identifier.
      responses:
        "200":
          description: Successful gateway device-connections response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayDeviceConnectionsResponse'
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
components:
  schemas:
    GatewayDeviceConnectionsResponse:
      type: object
      additionalProperties: true
      properties:
        accountId:
          type: string
        gatewayMac:
          type: string
        devices:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedDevice'
    ConnectedDevice:
      type: object
      additionalProperties: true
      properties:
        macAddress:
          type: string
        hostName:
          type: string
        deviceName:
          type: string
        connectionType:
          type: string
        band:
          type: string
        rssi:
          type: number
        signalStrength:
          type: string
        status:
          type: string
