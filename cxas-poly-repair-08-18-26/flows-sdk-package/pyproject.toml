[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flows"
version = "0.20.0"
description = "Author, validate, simulate, and emit CXAS/CES slot-filling agents — the build-time companion to cxas-scrapi (runtime)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ces", "cxas", "gecx", "slot-filling", "agent", "voice", "ivr"]
dependencies = [
  # Config models + native pydantic tool authoring (the examples/pydantic_cxas_tool.py style).
  "pydantic>=2",
  # Declarative flow authoring (flows/*.yaml). Pure-Python, tiny footprint.
  "pyyaml>=6",
]

# Deploy + live-eval pull the runtime SDK (cxas-scrapi) + GCP creds. Kept OUT of
# the core so `pip install flows` is a light, offline authoring install.
[project.optional-dependencies]
deploy = ["cxas-scrapi"]

[project.scripts]
flows = "flows.cli:main"

# --- hatchling packaging ----------------------------------------------------
# src-layout: the importable package is src/flows. The framework bundle under
# src/flows/engine/framework (blessed control tools + callbacks + engine/intake/
# validator) ships as PACKAGE DATA — its python_code.py files are read by path and
# emitted into app dirs, never imported as flows.* modules (they reference the
# CES-injected `context`/`tools` globals).
[tool.hatch.build.targets.wheel]
packages = ["src/flows"]
# The framework bundle (src/flows/engine/framework) ships as package data — its
# .json tool specs + python_code.py bodies are read by path and emitted into app
# dirs, never imported as flows.* modules. Include non-.py data files explicitly
# (hatchling ships .py automatically; artifacts covers the rest).
artifacts = [
  "src/flows/engine/framework/**/*.json",
]

# The prose the README links to. Without these the wheel is the ONLY thing a pip
# consumer has, and all 17 `docs/...` links in the README resolve to nothing — which
# is exactly what happened to somebody building an agent from the package alone.
# Mapped under the package so `pip show -f flows` lists them and they sit next to the
# code on disk.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "flows/docs"
"examples" = "flows/examples"

[tool.hatch.build.targets.sdist]
# docs/ + examples/ ride along because the wheel force-includes them, and the
# wheel is built FROM the sdist — omit them here and that include cannot resolve.
include = ["src/flows", "README.md", "docs", "examples"]
